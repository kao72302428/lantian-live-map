<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>環境清消｜藍田新願景</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f8fb;color:#17324d;position:relative;min-height:100vh}body::before{content:"";position:fixed;inset:0;z-index:-1;background:url('vision-bg-environment.svg') center/cover no-repeat;filter:saturate(.7)}main{max-width:900px;margin:auto;padding:28px 18px 56px}a{color:#176ca4;text-decoration:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#f4fbf7;font-weight:700}.card{background:#fff;border:1px solid #dfe8ee;border-radius:18px;padding:24px;margin-top:18px}h1{font-size:clamp(30px,5vw,46px);margin:14px 0}h2{margin-top:0}p,li{line-height:1.8;font-size:17px}</style></head><body><main><a href="vision.html">← 返回藍田新願景</a><div class="tag">里政治理目標</div><h1>環境清消｜乾淨社區與病媒防治</h1><section class="card"><h2>願景說明</h2><p>乾淨的生活環境直接影響居民健康與居住感受。藍田里可建立環境問題巡查與居民通報機制，針對髒亂點、積水處、病媒蚊、垃圾堆置及公共空間清潔等問題進行紀錄與追蹤。遇到需要主管機關處理的案件，透過明確通報與後續追蹤，提高處理效率。同時結合社區、志工與居民共同維護環境，讓清潔與防疫從臨時處理轉為日常管理。</p></section><section class="card"><h2>可落地作法</h2><ul><li>建立環境髒亂點通報</li><li>定期巡查積水與病媒熱點</li><li>協調環境消毒與清潔作業</li><li>推動社區自主清潔</li><li>宣導登革熱與病媒防治</li><li>建立問題位置與處理紀錄</li></ul></section></main></body></html>
