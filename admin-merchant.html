<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高大好店家管理｜智慧藍田</title><link rel="stylesheet" href="./admin-module.css?v=20260930-1"><style>.shell{max-width:1100px}.merchant-controls{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}label{display:grid;gap:5px}input,select,textarea{font:inherit;padding:9px;max-width:100%}button{cursor:pointer;padding:10px;margin:5px}button:disabled{opacity:.5;cursor:not-allowed}.merchant-row{padding:12px;border-bottom:1px solid #ddd}.merchant-row button{float:right}.message{padding:12px}.merchant-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.merchant-actions button{float:none;margin:0}.merchant-row{display:grid;gap:8px}.merchant-row input[type=number]{width:90px}.merchant-row .off{color:#a33;font-weight:bold}.merchant-row .on{color:#176b37;font-weight:bold}</style></head><body>
<header class="topbar"><a class="back" href="./admin.html">← 返回管理中心</a><div><div class="title">高大好店家管理</div><div class="sub">智慧藍田 LIVE 一點通｜第二階段隔離測試</div></div><span class="badge">協會管理員專用</span></header>
<main class="shell"><section class="gate"><h1 id="authTitle">管理員驗證中</h1><div id="authStatus" class="status">驗證中…</div></section>
<section class="panel"><h2>店家資料管理</h2><p>僅協會管理員可新增、修改、上下架及調整排序。現有商家資料不得刪除。所有修改僅限隔離測試分支。</p><div id="message" role="status" class="message">尚未載入</div><button id="newBtn" disabled>新增店家</button><form id="merchantForm"><input type="hidden" id="id"><div class="merchant-controls"><label>店名<input id="name" required maxlength="120" disabled></label><label>地址<input id="address" required maxlength="200" disabled></label><label>主分類<select id="group" required disabled><option value="">請選擇</option><option>美食餐飲</option><option>購物零售</option><option>居家服務</option><option>醫療保健</option><option>生活服務</option><option>教育休閒</option></select></label><label>次分類<input id="sub" maxlength="80" disabled></label><label>區域<input id="area" maxlength="80" disabled></label><label>電話<input id="phone" maxlength="50" disabled></label><label>地圖網址<input id="map" type="url" maxlength="500" disabled></label><label>官網<input id="website" type="url" maxlength="500" disabled></label><label>社群網址<input id="social" type="url" maxlength="500" disabled></label></div><label>店家介紹<textarea id="description" maxlength="1000" disabled></textarea></label><button id="saveBtn" type="submit" disabled>儲存店家</button></form></section>
<section class="panel"><h2>店家清單</h2><input id="search" type="search" placeholder="搜尋店名或地址" disabled><div id="count"></div><div id="list"></div></section></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./admin-merchant.js?v=phase2-2"></script></body></html>
