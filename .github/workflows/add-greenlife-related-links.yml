name: Add Greenlife Related Links

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-greenlife-related-links.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply page update
        run: python scripts/add-greenlife-related-links.py
      - name: Validate update
        run: |
          grep -q 'id="greenlife-related-links-interactive"' greenlife-map-v16.html
          test "$(grep -o 'class="greenlife-related-hotspot"' greenlife-map-v16.html | wc -l)" -eq 11
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenlife-map-v16.html
          git rm .github/workflows/add-greenlife-related-links.yml scripts/add-greenlife-related-links.py
          git commit -m "Add interactive Greenlife related links image"
          git push
