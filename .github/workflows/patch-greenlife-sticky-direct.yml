name: Patch Greenlife Sticky Direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-greenlife-sticky-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sticky positioning directly to Greenlife map source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('greenlife-map-v15.html')
          s=p.read_text(encoding='utf-8')
          marker='greenlife-map-sticky-direct-20261003'
          if marker in s:
              raise SystemExit('Direct sticky patch already exists; refusing duplicate patch.')
          required=['<div id="map"></div>','@media screen and (max-width: 768px)','</head>']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Required structure missing: '+repr(missing))
          css='''\n<style id="greenlife-map-sticky-direct-20261003">\n/* Keep the map visible while scrolling. Positioning only; map data/interactions unchanged. */\n@media screen and (min-width:769px){\n  #map{position:sticky!important;top:12px!important;z-index:2!important;}\n}\n@media screen and (max-width:768px){\n  #map{position:sticky!important;top:8px!important;bottom:auto!important;z-index:2!important;}\n}\n</style>\n'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify positioning-only patch
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('greenlife-map-v15.html').read_text(encoding='utf-8')
          assert s.count('id="greenlife-map-sticky-direct-20261003"') == 1
          assert 'position:sticky!important;top:12px!important;z-index:2!important' in s
          assert 'position:sticky!important;top:8px!important;bottom:auto!important;z-index:2!important' in s
          assert '<div id="map"></div>' in s
          for m in ['data-layer="bus"','data-layer="bike"','data-layer="trash"','data-layer="metro"']:
              assert m in s
          print('Direct sticky CSS verified; map/function markers preserved.')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenlife-map-v15.html
          git rm .github/workflows/patch-greenlife-sticky-direct.yml
          git commit -m "Apply Greenlife sticky map directly to source page"
          git push
