name: Preview Whitepaper Optimization
on:
  push:
    paths:
      - '.github/workflows/preview-whitepaper-optimization.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build optimized previews
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageDraw
          from pathlib import Path
          import json, os

          files=[f'{i:02}.png' for i in range(1,7)]
          # Preserve zones are normalized rectangles covering text/icons/graphic panels.
          preserve={
            '01.png':[(0,0,.47,1),(.69,0,1,1)],
            '02.png':[(0,0,1,.34),(0,.40,.77,1)],
            '03.png':[(0,0,1,.43),(0,.47,1,1)],
            '04.png':[(0,0,.68,.42),(0,.24,.53,1),(.47,.18,1,1)],
            '05.png':[(0,0,.68,.36),(0,.24,.40,1),(.34,.25,.76,1),(.72,.18,1,1)],
            '06.png':[(0,0,.65,.34),(.27,.58,.77,1),(.70,.15,1,1)]
          }
          out=Path('whitepaper-preview'); out.mkdir(exist_ok=True)
          report=[]; before=[]; after=[]
          for fn in files:
            p=Path(fn); src=Image.open(p).convert('RGB')
            w,h=src.size
            target_w=min(1900,w); target_h=round(h*target_w/w)
            base=src.resize((target_w,target_h),Image.Resampling.LANCZOS)
            # Mild background treatment: slightly lower saturation/contrast and lift brightness.
            treated=ImageEnhance.Color(base).enhance(.84)
            treated=ImageEnhance.Contrast(treated).enhance(.93)
            treated=ImageEnhance.Brightness(treated).enhance(1.06)
            # Feathered preserve mask; designated foreground regions remain original after resize.
            mask=Image.new('L',base.size,0)
            d=ImageDraw.Draw(mask)
            for x0,y0,x1,y1 in preserve[fn]:
              d.rectangle((round(x0*target_w),round(y0*target_h),round(x1*target_w),round(y1*target_h)),fill=255)
            final=Image.composite(base,treated,mask)
            outfn=out/(p.stem+'.webp')
            final.save(outfn,'WEBP',quality=92,method=6)
            report.append({'file':fn,'before_w':w,'before_h':h,'before_bytes':p.stat().st_size,'after_file':outfn.name,'after_w':target_w,'after_h':target_h,'after_bytes':outfn.stat().st_size})
            # contact sheet strips
            for bucket,img,label in [(before,base,'before'),(after,final,'after')]:
              t=img.copy(); t.thumbnail((900,320),Image.Resampling.LANCZOS)
              c=Image.new('RGB',(920,370),'white'); c.paste(t,((920-t.width)//2,10))
              ImageDraw.Draw(c).text((15,345),f'{fn} {label}',fill='black'); bucket.append(c)
          Path('whitepaper-optimization-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          sheet=Image.new('RGB',(1840,370*6),'white')
          for i in range(6): sheet.paste(before[i],(0,i*370)); sheet.paste(after[i],(920,i*370))
          sheet.save('whitepaper-before-after.jpg',quality=90,optimize=True)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whitepaper-optimization-preview
          path: |
            whitepaper-preview/*.webp
            whitepaper-optimization-report.json
            whitepaper-before-after.jpg
