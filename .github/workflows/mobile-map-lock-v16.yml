name: Mobile Map Lock V16

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-map-lock-v16.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile Leaflet interaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('greenlife-map-v16.html')
          s = p.read_text(encoding='utf-8')
          tag = 'mobile-map-lock-20261004'
          if tag in s:
              raise SystemExit('mobile lock already present')
          if 'leaflet@1.9.4' not in s:
              raise SystemExit('Leaflet baseline not found')
          if s.count('class="greenlife-related-hotspot"') != 11:
              raise SystemExit('protected hotspots changed')
          block = '''<script id="mobile-map-lock-20261004">
          (function(){
            if(!window.matchMedia('(max-width:650px)').matches) return;
            const mapEl=document.getElementById('map');
            if(!mapEl || typeof map==='undefined') return;
            const tabs=Array.from(document.querySelectorAll('.tabs button[data-layer]'));
            let unlocked=false;
            let activeLayer=document.querySelector('.tabs button.on[data-layer]')?.dataset.layer || null;
            const handlers=[map.dragging,map.touchZoom,map.scrollWheelZoom,map.doubleClickZoom,map.boxZoom,map.keyboard,map.tap].filter(Boolean);
            function lockMap(){
              handlers.forEach(h=>{if(typeof h.disable==='function') h.disable();});
              mapEl.style.pointerEvents='none';
              mapEl.style.touchAction='pan-y';
              mapEl.setAttribute('data-mobile-map-state','locked');
              unlocked=false;
            }
            function unlockMap(){
              handlers.forEach(h=>{if(typeof h.enable==='function') h.enable();});
              mapEl.style.pointerEvents='auto';
              mapEl.style.touchAction='none';
              mapEl.setAttribute('data-mobile-map-state','unlocked');
              unlocked=true;
            }
            lockMap();
            tabs.forEach(btn=>btn.addEventListener('click',()=>{
              const layer=btn.dataset.layer;
              if(!unlocked){activeLayer=layer;unlockMap();return;}
              if(activeLayer===layer){lockMap();return;}
              activeLayer=layer;
            }));
          })();
          </script>'''
          pos = s.rfind('</body>')
          if pos < 0:
              raise SystemExit('body close not found')
          s = s[:pos] + block + '\n' + s[pos:]
          if s.count('class="greenlife-related-hotspot"') != 11:
              raise SystemExit('hotspots changed after patch')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit page change and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenlife-map-v16.html
          git rm .github/workflows/mobile-map-lock-v16.yml
          git commit -m "Lock Greenlife map by default on mobile"
          git push
