name: Apply Whitepaper Watermark Fade
on:
  push:
    paths:
      - '.github/workflows/apply-whitepaper-watermark-fade.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fade only whitepaper page 2-6 backgrounds toward watermark level
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageDraw
          from pathlib import Path
          import hashlib, re

          files=[f'{i:02}.webp' for i in range(1,6)]
          preserve={
            '01.webp':[(.00,.00,.50,.92),(.73,.00,1.00,.27),(.73,.28,.99,.90)],
            '02.webp':[(.00,.00,.70,.31),(.76,.00,1.00,.25),(.00,.43,.82,.96)],
            '03.webp':[(.00,.00,.72,.29),(.76,.00,1.00,.24),(.00,.44,1.00,.96)],
            '04.webp':[(.00,.00,.70,.30),(.77,.00,1.00,.25),(.00,.28,.50,.96),(.49,.28,.82,.91)],
            '05.webp':[(.00,.00,.61,.29),(.77,.00,1.00,.24),(.34,.27,.73,.94),(.73,.30,1.00,.91)]
          }
          expected={
            '01.webp':(1900,635),'02.webp':(1900,634),'03.webp':(1900,633),
            '04.webp':(1900,635),'05.webp':(1900,635),'06.webp':(1900,635)
          }
          protect={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ['00_cover.png','06.webp']}

          html=Path('whitepaper.html').read_text(encoding='utf-8')
          expected_refs=['00_cover.png']+[f'{i:02}.webp?v=20261002-wp3' for i in range(1,6)]+['06.webp']
          found=re.findall(r'<img src="([^"]+)"',html)
          assert found==expected_refs,(found,expected_refs)

          for fn in files:
            p=Path(fn)
            src=Image.open(p).convert('RGB')
            assert src.size==expected[fn],(fn,src.size,expected[fn])
            w,h=src.size

            # Stronger background-only fade: low saturation/contrast + lifted brightness,
            # approximating a faint watermark while leaving protected foreground zones intact.
            treated=ImageEnhance.Color(src).enhance(.34)
            treated=ImageEnhance.Contrast(treated).enhance(.64)
            treated=ImageEnhance.Brightness(treated).enhance(1.28)

            mask=Image.new('L',src.size,0)
            d=ImageDraw.Draw(mask)
            for x0,y0,x1,y1 in preserve[fn]:
              d.rectangle((round(x0*w),round(y0*h),round(x1*w),round(y1*h)),fill=255)
            final=Image.composite(src,treated,mask)
            final.save(p,'WEBP',quality=92,method=6)

          html=html.replace('20261002-wp3','20261002-wp4')
          Path('whitepaper.html').write_text(html,encoding='utf-8')

          # Protected page 1 / page 7 assets must remain byte-identical.
          for p in ['00_cover.png','06.webp']:
            assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==protect[p],p
          PY
      - name: Verify scope, dimensions and page order
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          expected={'01.webp':(1900,635),'02.webp':(1900,634),'03.webp':(1900,633),'04.webp':(1900,635),'05.webp':(1900,635),'06.webp':(1900,635)}
          for fn,size in expected.items():
            im=Image.open(fn)
            assert im.size==size,(fn,im.size,size)
            assert im.format=='WEBP',(fn,im.format)
          html=Path('whitepaper.html').read_text(encoding='utf-8')
          found=re.findall(r'<img src="([^"]+)"',html)
          assert found==['00_cover.png','01.webp?v=20261002-wp4','02.webp?v=20261002-wp4','03.webp?v=20261002-wp4','04.webp?v=20261002-wp4','05.webp?v=20261002-wp4','06.webp'],found
          PY
          git diff --check
      - name: Commit scoped fade and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01.webp 02.webp 03.webp 04.webp 05.webp whitepaper.html
          git rm -f .github/workflows/apply-whitepaper-watermark-fade.yml
          git commit -m "Fade whitepaper backgrounds to watermark level"
          git push
