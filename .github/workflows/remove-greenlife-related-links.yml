name: Remove Greenlife Related Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-greenlife-related-links.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove only the existing related-links section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('greenlife-map-v15.html')
          s = p.read_text(encoding='utf-8')

          required = [
              '相關連結',
              '淨零綠生活資訊平台',
              '高雄市環境保護局',
              '高雄市交通局',
              '高雄捷運',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Required related-links markers missing: ' + repr(missing))

          token_re = re.compile(r'</?section\b[^>]*>', re.I)
          stack = []
          sections = []
          for m in token_re.finditer(s):
              tag = m.group(0)
              if tag.startswith('</') or tag.startswith('</'.upper()):
                  if not stack:
                      raise SystemExit('Unbalanced </section> before target')
                  start = stack.pop()
                  sections.append((start, m.end()))
              else:
                  stack.append(m.start())
          if stack:
              raise SystemExit('Unbalanced <section> tags')

          matches = []
          for start, end in sections:
              block = s[start:end]
              if all(x in block for x in required):
                  matches.append((end-start, start, end, block))

          if not matches:
              raise SystemExit('No section contains all required related-links markers')

          matches.sort(key=lambda x: x[0])
          smallest_len = matches[0][0]
          smallest = [m for m in matches if m[0] == smallest_len]
          if len(smallest) != 1:
              raise SystemExit('Target section is not unique')

          _, start, end, block = smallest[0]

          # Safety checks: the target must contain all four visible official-site cards,
          # but must not contain major unrelated map controls/content markers.
          for marker in ['data-layer="bus"', 'data-layer="bike"', 'data-layer="trash"', 'data-layer="metro"', '<div id="map"></div>']:
              if marker in block:
                  raise SystemExit('Target section unexpectedly contains unrelated map marker: ' + marker)

          before = s[:start]
          after = s[end:]
          new_s = before + after

          for x in required:
              if x in new_s:
                  raise SystemExit('Marker still present after removal: ' + x)

          # Verify unrelated core map markers remain unchanged in the document.
          for marker in ['data-layer="bus"', 'data-layer="bike"', 'data-layer="trash"', 'data-layer="metro"']:
              if s.count(marker) != new_s.count(marker):
                  raise SystemExit('Unrelated marker count changed: ' + marker)

          p.write_text(new_s, encoding='utf-8')
          print('Removed related-links section only:', start, end, 'bytes/chars:', end-start)
          PY

      - name: Verify diff and commit
        shell: bash
        run: |
          git diff --check
          git diff --stat
          python - <<'PY'
          from pathlib import Path
          s = Path('greenlife-map-v15.html').read_text(encoding='utf-8')
          for x in ['相關連結','淨零綠生活資訊平台','高雄市環境保護局','高雄市交通局','高雄捷運']:
              assert x not in s, x
          for marker in ['data-layer="bus"','data-layer="bike"','data-layer="trash"','data-layer="metro"']:
              assert marker in s, marker
          print('Related-links removal verified; core map markers preserved.')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenlife-map-v15.html
          git rm .github/workflows/remove-greenlife-related-links.yml
          git commit -m "Remove Greenlife related links section"
          git push
