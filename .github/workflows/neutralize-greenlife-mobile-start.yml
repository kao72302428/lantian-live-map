name: Neutralize Greenlife Mobile Start

on:
  push:
    paths:
      - '.github/workflows/neutralize-greenlife-mobile-start.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make mobile Greenlife map neutral until a function button is tapped
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('greenlife-map-v15.html')
          s=p.read_text(encoding='utf-8')
          marker='greenlife-mobile-neutral-start-20261003'
          if marker in s:
              raise SystemExit('Neutral-start patch already exists; refusing duplicate patch.')
          required=[
            '<div class="tabs"><button class="on" data-layer="bus">',
            'const G={bus:L.layerGroup().addTo(map),bike:L.layerGroup(),trash:L.layerGroup(),metro:L.layerGroup()};',
            "showBus('r56')",
            "document.querySelectorAll('.tabs button').forEach",
            '</body>'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Required markers missing: '+repr(missing))
          js='''\n<script id="greenlife-mobile-neutral-start-20261003">\n(()=>{\n  if(!window.matchMedia('(max-width:768px)').matches) return;\n  const neutralize=()=>{\n    document.querySelectorAll('.tabs button').forEach(btn=>btn.classList.remove('on'));\n    try{ Object.values(G).forEach(group=>map.removeLayer(group)); }catch(err){}\n  };\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',neutralize,{once:true});\n  }else{\n    neutralize();\n  }\n})();\n</script>\n'''
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exact scope
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('greenlife-map-v15.html').read_text(encoding='utf-8')
          assert s.count('id="greenlife-mobile-neutral-start-20261003"') == 1
          assert "document.querySelectorAll('.tabs button').forEach(btn=>btn.classList.remove('on'))" in s
          assert 'Object.values(G).forEach(group=>map.removeLayer(group))' in s
          assert 'id="greenlife-mobile-map-static-20261003"' in s
          for marker in ['data-layer="bus"','data-layer="bike"','data-layer="trash"','data-layer="metro"']:
              assert marker in s
          print('Mobile neutral initial state verified; original button handlers preserved.')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenlife-map-v15.html
          git rm .github/workflows/neutralize-greenlife-mobile-start.yml
          git commit -m "Require Greenlife mobile function selection before map linkage"
          git push
