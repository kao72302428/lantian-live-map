name: Inspect Greenlife Mobile State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-greenlife-mobile.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Greenlife source only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('greenlife-map-v15.html').read_text(encoding='utf-8')
          needles=['相關連結','淨零綠生活資訊平台','高雄市環境保護局','高雄市交通局','高雄捷運','green-travel-links','綠色出行','green-travel-grid']
          print('FILE_LENGTH',len(s))
          for n in needles:
              print('COUNT',repr(n),s.count(n))
              start=0
              i=0
              while True:
                  pos=s.find(n,start)
                  if pos<0: break
                  i+=1
                  a=max(0,pos-350); b=min(len(s),pos+700)
                  print(f'CONTEXT {n!r} #{i} POS {pos}:')
                  print(s[a:b].replace('\n','\\n'))
                  start=pos+len(n)
          for q in ['@media(max-width:650px)','@media screen and (min-width:651px)','display:none','serviceWorker','navigator.serviceWorker']:
              print('SPECIAL',repr(q),s.count(q))
          PY
      - name: Self-remove inspection workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-greenlife-mobile.yml
          git commit -m "Remove one-time Greenlife mobile inspection workflow"
          git push
