name: Inspect Greenlife Mobile

on:
  push:
    paths:
      - '.github/workflows/inspect-greenlife-mobile.yml'

permissions:
  contents: read
\ njobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant Greenlife mobile map code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('greenlife-map-v15.html')
          s=p.read_text(encoding='utf-8')
          terms=[
            'data-layer="bus"','data-layer="bike"','data-layer="trash"','data-layer="metro"',
            'mobile-tabs-final-fix','L.map','setView','flyTo','panTo','fitBounds','invalidateSize',
            'addEventListener','querySelectorAll','pointer-events','touch-action','map.dragging',
            'scrollWheelZoom','touchZoom','doubleClickZoom','boxZoom','keyboard'
          ]
          lines=s.splitlines()
          hits=set()
          for i,line in enumerate(lines):
            if any(t in line for t in terms):
              for j in range(max(0,i-4),min(len(lines),i+8)):
                hits.add(j)
          out=[]
          for j in sorted(hits):
            out.append(f'{j+1}: {lines[j]}')
          Path('greenlife-mobile-inspect.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[:400]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: greenlife-mobile-inspect
          path: greenlife-mobile-inspect.txt
