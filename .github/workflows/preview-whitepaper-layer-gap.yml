name: Preview Whitepaper Layer Gap
on:
  push:
    paths:
      - '.github/workflows/preview-whitepaper-layer-gap.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stronger background-layer preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageDraw
          from pathlib import Path
          import json

          files=[f'{i:02}.webp' for i in range(1,6)]
          preserve={
            '01.webp':[(0,0,.47,1),(.69,0,1,1)],
            '02.webp':[(0,0,1,.34),(0,.40,.77,1)],
            '03.webp':[(0,0,1,.43),(0,.47,1,1)],
            '04.webp':[(0,0,.68,.42),(0,.24,.53,1),(.47,.18,1,1)],
            '05.webp':[(0,0,.68,.36),(0,.24,.40,1),(.34,.25,.76,1),(.72,.18,1,1)]
          }
          out=Path('layer-gap-preview'); out.mkdir(exist_ok=True)
          rows=[]
          for fn in files:
            src=Image.open(fn).convert('RGB'); w,h=src.size
            treated=ImageEnhance.Color(src).enhance(.74)
            treated=ImageEnhance.Contrast(treated).enhance(.86)
            treated=ImageEnhance.Brightness(treated).enhance(1.14)
            mask=Image.new('L',src.size,0); d=ImageDraw.Draw(mask)
            for x0,y0,x1,y1 in preserve[fn]:
              d.rectangle((round(x0*w),round(y0*h),round(x1*w),round(y1*h)),fill=255)
            final=Image.composite(src,treated,mask)
            final.save(out/fn,'WEBP',quality=92,method=6)
            rows.append({'file':fn,'size':[w,h],'bytes_before':Path(fn).stat().st_size,'bytes_preview':(out/fn).stat().st_size})
          # contact sheet: cover reference at top, then current/preview pairs
          cover=Image.open('00_cover.png').convert('RGB')
          cover.thumbnail((1500,500),Image.Resampling.LANCZOS)
          sheet=Image.new('RGB',(1520,570+5*430),'white')
          sheet.paste(cover,((1520-cover.width)//2,20))
          ImageDraw.Draw(sheet).text((20,530),'COVER REFERENCE',fill='black')
          for idx,fn in enumerate(files):
            cur=Image.open(fn).convert('RGB'); prv=Image.open(out/fn).convert('RGB')
            cur.thumbnail((740,360),Image.Resampling.LANCZOS); prv.thumbnail((740,360),Image.Resampling.LANCZOS)
            y=570+idx*430
            sheet.paste(cur,(10+(740-cur.width)//2,y+10))
            sheet.paste(prv,(770+(740-prv.width)//2,y+10))
            dr=ImageDraw.Draw(sheet)
            dr.text((20,y+380),f'{fn} CURRENT',fill='black')
            dr.text((780,y+380),f'{fn} PREVIEW',fill='black')
          sheet.save('whitepaper-layer-gap-preview.jpg',quality=91,optimize=True)
          Path('layer-gap-report.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whitepaper-layer-gap-preview
          path: |
            layer-gap-preview/*.webp
            whitepaper-layer-gap-preview.jpg
            layer-gap-report.json
