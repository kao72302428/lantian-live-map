name: Fix Greenlife Related Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-greenlife-related-image.yml'

permissions:
  contents: write

jobs:
  fix-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild related-links image as high-resolution PNG only
        shell: bash
        run: |
          set -euo pipefail
          test -f greenlife-map-v16.html
          test -f assets/greenlife-related-links.jpg
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          src=Path('assets/greenlife-related-links.jpg')
          out=Path('assets/greenlife-related-links-hd.png')
          im=Image.open(src).convert('RGBA')
          assert im.size == (2048,682), im.size
          hd=im.resize((4096,1364), Image.Resampling.LANCZOS)
          hd=hd.filter(ImageFilter.UnsharpMask(radius=1.2, percent=110, threshold=2))
          hd.save(out, format='PNG', optimize=True)
          check=Image.open(out)
          assert check.size == (4096,1364), check.size
          assert check.format == 'PNG'

          page=Path('greenlife-map-v16.html')
          s=page.read_text(encoding='utf-8')
          assert s.count('class="greenlife-related-hotspot"') == 11
          assert s.count('./assets/greenlife-related-links.jpg') == 1
          assert './assets/greenlife-related-links-hd.png' not in s
          new=s.replace('./assets/greenlife-related-links.jpg','./assets/greenlife-related-links-hd.png')
          assert new.count('class="greenlife-related-hotspot"') == 11
          assert new.count('./assets/greenlife-related-links-hd.png') == 1
          page.write_text(new,encoding='utf-8')
          PY
          git diff --check
      - name: Commit image-only repair and self-remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/greenlife-related-links-hd.png greenlife-map-v16.html
          git rm .github/workflows/fix-greenlife-related-image.yml
          git commit -m "Fix Greenlife related image rendering quality"
          git push
