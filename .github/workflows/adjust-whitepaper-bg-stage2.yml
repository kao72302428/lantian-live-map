name: Adjust Whitepaper Background Stage 2
on:
  push:
    paths:
      - '.github/workflows/adjust-whitepaper-bg-stage2.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighten backgrounds on whitepaper pages 2-6 only
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageDraw
          from pathlib import Path
          import hashlib, json

          files=[f'{i:02}.webp' for i in range(1,6)]
          preserve={
            '01.webp':[(0,0,.47,1),(.69,0,1,1)],
            '02.webp':[(0,0,1,.34),(0,.40,.77,1)],
            '03.webp':[(0,0,1,.43),(0,.47,1,1)],
            '04.webp':[(0,0,.68,.42),(0,.24,.53,1),(.47,.18,1,1)],
            '05.webp':[(0,0,.68,.36),(0,.24,.40,1),(.34,.25,.76,1),(.72,.18,1,1)]
          }
          protected=['00_cover.png','06.webp','whitepaper.html']
          protected_hash={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          report=[]

          for fn in files:
            p=Path(fn)
            src=Image.open(p).convert('RGB')
            w,h=src.size
            base=src.copy()
            # Stage-2 background-only lightening. Foreground preserve zones remain byte-visual equivalent before WebP re-encode.
            treated=ImageEnhance.Color(base).enhance(.88)
            treated=ImageEnhance.Contrast(treated).enhance(.94)
            treated=ImageEnhance.Brightness(treated).enhance(1.05)
            mask=Image.new('L',base.size,0)
            d=ImageDraw.Draw(mask)
            for x0,y0,x1,y1 in preserve[fn]:
              d.rectangle((round(x0*w),round(y0*h),round(x1*w),round(y1*h)),fill=255)
            final=Image.composite(base,treated,mask)
            before=p.stat().st_size
            final.save(p,'WEBP',quality=92,method=6)
            report.append({'file':fn,'width':w,'height':h,'before_bytes':before,'after_bytes':p.stat().st_size})

          # Only add cache-busting query to pages 2-6. No layout or order changes.
          wp=Path('whitepaper.html')
          html=wp.read_text(encoding='utf-8')
          for i in range(1,6):
            html=html.replace(f'{i:02}.webp"',f'{i:02}.webp?v=20261002-wp2"')
          wp.write_text(html,encoding='utf-8')

          # protected assets must remain unchanged; HTML changes only expected query strings.
          for p in ['00_cover.png','06.webp']:
            assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==protected_hash[p], p
          Path('stage2-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Verify dimensions, format, order and protected scope
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          expected_sizes={
            '01.webp':(1900,635),
            '02.webp':(1900,634),
            '03.webp':(1900,633),
            '04.webp':(1900,635),
            '05.webp':(1900,635),
            '06.webp':(1900,635),
          }
          for fn,size in expected_sizes.items():
            im=Image.open(fn)
            assert im.size==size,(fn,im.size,size)
            assert im.format=='WEBP',(fn,im.format)
          html=Path('whitepaper.html').read_text(encoding='utf-8')
          found=re.findall(r'<img src="([^"]+)"',html)
          assert found==['00_cover.png','01.webp?v=20261002-wp2','02.webp?v=20261002-wp2','03.webp?v=20261002-wp2','04.webp?v=20261002-wp2','05.webp?v=20261002-wp2','06.webp'],found
          print('Dimensions, WEBP format, page order, cover and page 7 protection verified.')
          PY
          git diff --check
          git diff -- whitepaper.html
      - name: Commit stage-2 background adjustment and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01.webp 02.webp 03.webp 04.webp 05.webp whitepaper.html
          git rm .github/workflows/adjust-whitepaper-bg-stage2.yml
          git commit -m "Lighten whitepaper content backgrounds"
          git push
