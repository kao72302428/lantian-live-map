name: Inspect Greenlife Live Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-greenlife-live-pages.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live GitHub Pages HTML
        shell: bash
        run: |
          set -e
          URL="https://kao72302428.github.io/lantian-live-map/greenlife-map-v15.html?probe=$(date +%s)"
          curl -L --fail -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$URL" -o /tmp/live.html
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/live.html').read_text(encoding='utf-8',errors='replace')
          print('LIVE_LENGTH',len(s))
          for n in ['相關連結','淨零綠生活資訊平台','高雄市環境保護局','高雄市交通局','高雄捷運','green-travel-links','綠色出行','green-travel-grid','greenlife-row-layout-20261004']:
              print('LIVE_COUNT',repr(n),s.count(n))
          PY
      - name: Self-remove inspection workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-greenlife-live-pages.yml
          git commit -m "Remove one-time Greenlife live Pages inspection"
          git push
