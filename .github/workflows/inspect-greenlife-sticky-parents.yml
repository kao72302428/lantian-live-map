name: Inspect Greenlife Sticky Parents

on:
  push:
    branches: [inspect-greenlife-mobile-sticky]
    paths:
      - '.github/workflows/inspect-greenlife-sticky-parents.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract map structure and sticky-related CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('greenlife-map-v15.html').read_text(encoding='utf-8')
          out=[]
          # map HTML context
          idx=s.find('id="map"')
          out.append('=== MAP HTML CONTEXT ===')
          if idx>=0:
              out.append(s[max(0,idx-3000):idx+3000])
          else:
              out.append('id="map" NOT FOUND')
          # sticky-affecting CSS/property lines with nearby context
          out.append('\n=== STICKY RELATED LINES ===')
          lines=s.splitlines()
          terms=['#map','overflow:','overflow-x','overflow-y','transform:','position:','contain:','filter:','perspective:','@media','height:','max-height:','.map','main{','.wrap','.container','.card']
          hits=set()
          for i,line in enumerate(lines):
              if any(t in line for t in terms):
                  for j in range(max(0,i-2),min(len(lines),i+3)):
                      hits.add(j)
          out.extend(f'{j+1}: {lines[j]}' for j in sorted(hits))
          Path('sticky-inspect.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-inspect
          path: sticky-inspect.txt
