name: Apply Whitepaper Optimization
on:
  push:
    paths:
      - '.github/workflows/apply-whitepaper-optimization.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize whitepaper pages 2-7 only
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageDraw
          from pathlib import Path
          import hashlib, json
          files=[f'{i:02}.png' for i in range(1,7)]
          preserve={
            '01.png':[(0,0,.47,1),(.69,0,1,1)],
            '02.png':[(0,0,1,.34),(0,.40,.77,1)],
            '03.png':[(0,0,1,.43),(0,.47,1,1)],
            '04.png':[(0,0,.68,.42),(0,.24,.53,1),(.47,.18,1,1)],
            '05.png':[(0,0,.68,.36),(0,.24,.40,1),(.34,.25,.76,1),(.72,.18,1,1)],
            '06.png':[(0,0,.65,.34),(.27,.58,.77,1),(.70,.15,1,1)]
          }
          cover=Path('00_cover.png')
          cover_sha=hashlib.sha256(cover.read_bytes()).hexdigest()
          report=[]
          for fn in files:
            p=Path(fn); src=Image.open(p).convert('RGB'); w,h=src.size
            tw=min(1900,w); th=round(h*tw/w)
            base=src.resize((tw,th),Image.Resampling.LANCZOS)
            treated=ImageEnhance.Color(base).enhance(.84)
            treated=ImageEnhance.Contrast(treated).enhance(.93)
            treated=ImageEnhance.Brightness(treated).enhance(1.06)
            mask=Image.new('L',base.size,0); d=ImageDraw.Draw(mask)
            for x0,y0,x1,y1 in preserve[fn]:
              d.rectangle((round(x0*tw),round(y0*th),round(x1*tw),round(y1*th)),fill=255)
            final=Image.composite(base,treated,mask)
            out=Path(p.stem+'.webp')
            final.save(out,'WEBP',quality=92,method=6)
            report.append({'source':fn,'source_size':[w,h],'source_bytes':p.stat().st_size,'output':out.name,'output_size':[tw,th],'output_bytes':out.stat().st_size})
          # Update only image extensions 01..06; cover remains PNG and page order unchanged.
          wp=Path('whitepaper.html')
          html=wp.read_text(encoding='utf-8')
          original=html
          for i in range(1,7): html=html.replace(f'{i:02}.png',f'{i:02}.webp')
          assert '00_cover.png' in html
          assert all(f'{i:02}.webp' in html for i in range(1,7))
          wp.write_text(html,encoding='utf-8')
          assert hashlib.sha256(cover.read_bytes()).hexdigest()==cover_sha
          Path('whitepaper-optimization-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Verify protected scope
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          html=Path('whitepaper.html').read_text(encoding='utf-8')
          expected=['00_cover.png']+[f'{i:02}.webp' for i in range(1,7)]
          found=re.findall(r'<img src="([^"]+)"',html)
          assert found==expected, (found,expected)
          for i in range(1,7):
            a=Image.open(f'{i:02}.png'); b=Image.open(f'{i:02}.webp')
            assert b.width==1900
            assert abs(a.width/a.height-b.width/b.height)<0.003
          print('Page order, cover reference, dimensions and aspect ratios verified.')
          PY
          git diff --check
      - name: Commit optimized assets and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whitepaper.html 01.webp 02.webp 03.webp 04.webp 05.webp 06.webp
          git rm -f .github/workflows/inspect-whitepaper-images.yml .github/workflows/preview-whitepaper-optimization.yml .github/workflows/apply-whitepaper-optimization.yml
          git commit -m "Optimize whitepaper content images"
          git push
