name: Promote Greenlife V16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-greenlife-v16.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy verified v15 to fresh v16 path and update entry only
        shell: bash
        run: |
          set -euo pipefail
          test -f greenlife-map-v15.html
          test -f greenlife.html
          test ! -e greenlife-map-v16.html
          python - <<'PY'
          from pathlib import Path
          src=Path('greenlife-map-v15.html').read_bytes()
          text=src.decode('utf-8')
          # Safety assertions: verified current content must be present/absent exactly as expected.
          assert '相關連結' not in text
          assert '淨零綠生活資訊平台' not in text
          assert '高雄市環境保護局' not in text
          assert '高雄市交通局' not in text
          assert 'green-travel-links' in text
          assert '綠色出行' in text
          assert 'greenlife-row-layout-20261004' in text
          Path('greenlife-map-v16.html').write_bytes(src)

          p=Path('greenlife.html')
          entry=p.read_text(encoding='utf-8')
          assert entry.count('greenlife-map-v15.html') == 3
          new=entry.replace('greenlife-map-v15.html','greenlife-map-v16.html')
          assert new.count('greenlife-map-v16.html') == 3
          assert 'greenlife-map-v15.html' not in new
          p.write_text(new,encoding='utf-8')
          PY
          cmp greenlife-map-v15.html greenlife-map-v16.html
          git diff --check
      - name: Commit v16 and self-remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenlife-map-v16.html greenlife.html
          git rm .github/workflows/promote-greenlife-v16.yml
          git commit -m "Promote verified Greenlife page to v16 path"
          git push
