name: Inspect Whitepaper Images
on:
  push:
    paths:
      - '.github/workflows/inspect-whitepaper-images.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect image metadata and build contact sheet
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import json
          files=[f'{i:02}.png' for i in range(1,7)]
          rows=[]
          thumbs=[]
          for fn in files:
              p=Path(fn)
              im=Image.open(p).convert('RGB')
              rows.append({'file':fn,'width':im.width,'height':im.height,'bytes':p.stat().st_size,'mode':Image.open(p).mode})
              t=im.copy(); t.thumbnail((900,500),Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(920,540),'white')
              canvas.paste(t,((920-t.width)//2,25))
              ImageDraw.Draw(canvas).text((20,510),f'{fn}  {im.width}x{im.height}  {p.stat().st_size} bytes',fill='black')
              thumbs.append(canvas)
          sheet=Image.new('RGB',(920,540*len(thumbs)),'white')
          for idx,t in enumerate(thumbs): sheet.paste(t,(0,idx*540))
          Path('whitepaper-image-metadata.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          sheet.save('whitepaper-contact-sheet.jpg',quality=90,optimize=True)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whitepaper-image-inspection
          path: |
            whitepaper-image-metadata.json
            whitepaper-contact-sheet.jpg
