<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>燈亮・路平・水溝通｜藍田新願景</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f8fb;color:#17324d;min-height:100vh}main{max-width:900px;margin:auto;padding:28px 18px 56px}a{color:#176ca4;text-decoration:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#f4fbf7;font-weight:700}.card{position:relative;isolation:isolate;overflow:hidden;background:#fff;border:1px solid #dfe8ee;border-radius:18px;padding:24px;margin-top:18px}.card::before{content:"";position:absolute;inset:0;z-index:-2;background:url('vision-bg-infrastructure.svg') center/cover no-repeat;filter:saturate(.7)}.card::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.66)}.card:nth-of-type(2)::before{background-position:center 72%}h2{margin-top:0}p,li{line-height:1.8;font-size:17px}</style></head><body><main><a href="vision.html">← 返回藍田新願景</a><div class="tag">里政治理目標</div><section class="card"><h2>願景說明</h2><p>路燈、道路與排水看似基本，卻是居民每天最直接感受到的里政服務。未來可建立公共設施通報與追蹤機制，針對路燈故障、道路坑洞、人行空間、排水不良及水溝堵塞等問題，透過居民回報、現場確認及主管機關協調，加快問題被發現與處理的速度。重點不是承諾所有問題立即解決，而是讓每一件反映都有紀錄、有追蹤、有結果。</p></section><section class="card"><h2>可落地作法</h2><ul><li>建立路燈故障通報</li><li>道路坑洞及人行空間巡查</li><li>排水與水溝問題通報</li><li>豪雨前後重點區域巡查</li><li>建立案件編號與追蹤機制</li><li>公開重大公共設施改善進度</li></ul></section></main></body></html>
