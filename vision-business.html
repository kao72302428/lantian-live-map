<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>推動商圈發展｜藍田新願景</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f8fb;color:#17324d;min-height:100vh}main{max-width:900px;margin:auto;padding:28px 18px 56px}a{color:#176ca4;text-decoration:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#e7f5ff;font-weight:700}.card{position:relative;isolation:isolate;overflow:hidden;background:#fff;border:1px solid #dfe8ee;border-radius:18px;padding:24px;margin-top:18px}.card::before{content:"";position:absolute;inset:0;z-index:-2;background:url('vision-bg-business.svg') center/cover no-repeat;filter:saturate(.7)}.card::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.66)}.card:nth-of-type(2)::before{background-position:center 72%}h2{margin-top:0}p,li{line-height:1.8;font-size:17px}</style></head><body><main><a href="vision.html">← 返回藍田新願景</a><div class="tag">核心主軸</div><section class="card"><h2>願景說明</h2><p>住宅增加之後，地方發展不應只停留在人口成長，也要讓生活機能、商業活動與社區交流同步提升。透過盤點在地商家、建立店家資料庫、數位美食與生活地圖，讓居民更容易認識附近商家，也讓店家有更多被看見的機會。未來可結合市集、親子活動、節慶企劃及商圈行銷，逐步形成「居民在地消費、店家共同推廣、活動帶動人潮」的循環，提升地方便利性與商業活力。</p></section><section class="card"><h2>可落地作法</h2><ul><li>建立藍田里商家資料庫</li><li>建立「高大好店家」分類地圖</li><li>定期進行商家訪談與需求蒐集</li><li>推動地方市集、節慶、親子活動</li><li>串聯店家優惠與共同宣傳</li><li>規劃商圈發展交流與說明活動</li></ul></section></main></body></html>
