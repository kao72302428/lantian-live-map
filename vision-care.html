<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>長者・幼童・弱勢照護｜藍田新願景</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f8fb;color:#17324d;position:relative;min-height:100vh}body::before{content:"";position:fixed;inset:0;z-index:-1;background:url('vision-bg-care.svg') center/cover no-repeat;filter:saturate(.7)}main{max-width:900px;margin:auto;padding:28px 18px 56px}a{color:#176ca4;text-decoration:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#f4fbf7;font-weight:700}.card{background:rgba(255,255,255,.92);border:1px solid #dfe8ee;border-radius:18px;padding:24px;margin-top:18px}h1{font-size:clamp(30px,5vw,46px);margin:14px 0}h2{margin-top:0}p,li{line-height:1.8;font-size:17px}</style></head><body><main><a href="vision.html">← 返回藍田新願景</a><div class="tag">里政治理目標</div><h1>長者・幼童・弱勢照護｜建立社區關懷網絡</h1><section class="card"><h2>願景說明</h2><p>社區治理除了建設，也需要照顧不同年齡與生活狀況的居民。藍田里可逐步整理長者、親子、弱勢家庭可使用的政府與民間資源，建立清楚易懂的資訊入口，並透過社區活動增加居民互動。對於需要協助的家庭，可協助轉介相關主管機關或社福資源。里政角色不是取代專業社福，而是成為居民找到正確資源的第一個入口。</p></section><section class="card"><h2>可落地作法</h2><ul><li>整理長者福利與社福資訊</li><li>建立親子活動與育兒資訊</li><li>提供弱勢資源轉介窗口</li><li>推動長者關懷活動</li><li>規劃親子與跨世代活動</li><li>串聯社區志工與公益資源</li></ul></section></main></body></html>
