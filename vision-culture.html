<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>人文教育｜藍田新願景</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f8fb;color:#17324d;min-height:100vh}main{max-width:900px;margin:auto;padding:28px 18px 56px}a{color:#176ca4;text-decoration:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#f4fbf7;font-weight:700}.card{position:relative;isolation:isolate;overflow:hidden;background:#fff;border:1px solid #dfe8ee;border-radius:18px;padding:24px;margin-top:18px}.card::before{content:"";position:absolute;inset:0;z-index:-2;background:url('vision-bg-culture.svg') center/cover no-repeat;filter:saturate(.7)}.card::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.66)}.card:nth-of-type(2)::before{background-position:center 72%}h2{margin-top:0}p,li{line-height:1.8;font-size:17px}</style></head><body><main><a href="vision.html">← 返回藍田新願景</a><div class="tag">里政治理目標</div><section class="card"><h2>願景說明</h2><p>一個成熟的社區不只有住宅與公共建設，也需要居民共同形成地方認同。藍田里可透過親子活動、地方故事、環境教育、生活講座及社區交流，讓居民更了解自己生活的地方。未來可整理社區發展資訊、公共建設紀錄與地方特色，逐步建立屬於藍田的在地資料。透過教育與參與，讓新住民、家庭、學生與長者都有機會認識社區、參與社區。</p></section><section class="card"><h2>可落地作法</h2><ul><li>辦理生活與公共議題講座</li><li>規劃親子教育活動</li><li>蒐集地方故事與社區資料</li><li>建立社區發展紀錄</li><li>推廣環境與公民教育</li><li>鼓勵居民參與公共事務</li></ul></section></main></body></html>
