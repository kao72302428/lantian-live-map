function categoryOf(x){
 const sub=(x.sub||'');
 if(x.group==='美食'||/餐|飲料|茶|咖啡|冰品|早餐|火鍋|鍋物|燒肉|小吃|麵食|便當|熟食|快餐|粥|居酒屋|海鮮|甜點|點心/.test(sub)) return '美食餐飲';
 if(x.group==='醫療'||/診所|內科|兒科|耳鼻喉|牙醫|藥局|醫院|復健|中醫/.test(sub)) return '醫療保健';
 if(/超市|量販|便利商店|百貨|零售|雜貨|文具|服飾|珠寶|帽類|3C|通訊/.test(sub)) return '購物零售';
 if(/五金|建材|家具|窗簾|裝潢|修鞋|洗衣/.test(sub)) return '居家服務';
 if(/美髮|美容|理髮|養生|寵物|汽車|機車|洗車|鍍膜|停車|房仲/.test(sub)) return '生活服務';
 if(/教育|補習|才藝|運動|健身|休閒|娛樂|親子/.test(sub)) return '教育休閒';
 return x.group==='居家'?'生活服務':x.group;
}
let group='全部',subGroup='全部',query='';
const list=document.getElementById('list'),hint=document.getElementById('hint'),mapbox=document.getElementById('mapbox');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function filtered(){return data.filter(x=>(group==='全部'||categoryOf(x)===group)&&(subGroup==='全部'||x.sub===subGroup)&&(!query||[x.name,x.address,x.sub,x.area,categoryOf(x)].join(' ').toLowerCase().includes(query)))}
function renderSubs(){
 const box=document.getElementById('subfilters');
 if(group==='全部'){box.innerHTML='';return}
 const subs=[...new Set(data.filter(x=>categoryOf(x)===group).map(x=>x.sub).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
 box.innerHTML=['全部',...subs].map(v=>`<button data-sub="${esc(v)}" class="${v===subGroup?'active':''}">${esc(v)}</button>`).join('');
 box.querySelectorAll('button[data-sub]').forEach(b=>b.onclick=()=>{subGroup=b.dataset.sub;renderSubs();resetMap();render();});
}
function render(){
 const a=filtered();
 list.innerHTML=a.map(x=>`<div class="card" data-i="${data.indexOf(x)}"><div class="name">${esc(x.name)}</div><div class="meta"><span class="tag">${esc(categoryOf(x))}</span><span class="tag">${esc(x.sub)}</span></div><div class="meta">📍 ${esc(x.address)}</div></div>`).join('')||'<div class="card">沒有符合資料</div>';
 document.querySelectorAll('.card[data-i]').forEach(c=>c.onclick=()=>select(+c.dataset.i,c));
}
function resetMap(){
 document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));
 hint.textContent='請點選商家查看位置';
 mapbox.className='placeholder';
 mapbox.innerHTML='選擇左側商家後，這裡會顯示地圖';
}
function select(i,el){
 document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');
 const x=data[i];
 const q=(x.address.includes('待查')||x.address.includes('生活圈'))?`${x.name} 高雄 楠梓`:`${x.name} ${x.address}`;
 hint.textContent=x.name+'｜'+x.address;
 mapbox.className='';
 mapbox.innerHTML=`<iframe id="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(q)}&output=embed"></iframe>`;
 if(window.innerWidth<=768) setTimeout(()=>document.getElementById('mapwrap').scrollIntoView({behavior:'smooth',block:'start'}),200);
}
document.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{
 group=b.dataset.g; subGroup='全部'; renderSubs();
 document.querySelectorAll('button[data-g]').forEach(x=>x.classList.toggle('active',x.dataset.g===group));
 resetMap(); render();
 window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();resetMap();render();};
const categoryParam=new URLSearchParams(location.search).get('category');
const categoryMap={food:'美食餐飲',home:'居家服務',medical:'醫療保健',foodservice:'美食餐飲',retail:'購物零售',homeservice:'居家服務',health:'醫療保健',life:'生活服務',leisure:'教育休閒'};
if(categoryMap[categoryParam]) group=categoryMap[categoryParam];
document.querySelectorAll('button[data-g]').forEach(b=>b.classList.toggle('active',b.dataset.g===group));
resetMap();render();
</script>
