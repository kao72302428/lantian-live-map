<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智慧藍田｜高大好店家</title>
<link rel="stylesheet" href="./merchant.css?v=20261003-mobile-buttons-compact">
<style>.buttons button.active{background:#9FD3FF!important;color:#17324D!important;border-color:#9FD3FF!important}</style>
</head>
<body>
<div class="hero"><img src="./merchant-header-new.png?v=f2eb74d8359c" alt="高大好店家｜吃喝・購物・居家・健康・生活・休閒"></div>
<div class="toolbar">
  <div class="buttons">
    <button type="button" data-g="全部">全部</button>
    <button type="button" data-g="美食餐飲">🍜 吃喝</button>
    <button type="button" data-g="購物零售">🛍️ 購物</button>
    <button type="button" data-g="居家服務">🏠 居家</button>
    <button type="button" data-g="醫療保健">🩺 保健</button>
    <button type="button" data-g="生活服務">⚙️ 生活</button>
    <button type="button" data-g="教育休閒">👟 休閒</button>
  </div>
  <div id="subfilters" class="subfilters"></div>
  <input id="search" class="search" type="search" autocomplete="off" placeholder="搜尋店名、地址、服務類型">
</div>
<main class="layout">
  <section id="list" class="list"></section>
  <section id="mapwrap" class="mapwrap">
    <div class="hint" id="hint">高大好店家地圖｜點選商家查看位置</div>
    <div id="mapbox"></div>
  </section>
</main>
<script src="./merchants.js?v=20260928-1205"></script>
<script src="./merchant-app.js?v=20261003-mobile-map-link-fix"></script>

</html>
