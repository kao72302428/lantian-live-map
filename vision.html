<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藍田新願景｜智慧藍田 LIVE 一點通</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f8fb;color:#17324d;line-height:1.6}
.vision-hero{min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px;background:linear-gradient(135deg,#dff4ff 0%,#eef8ff 48%,#e9f7f0 100%);border-bottom:1px solid #dbe8ef}
.vision-hero-inner{width:min(960px,100%)}
.vision-kicker{margin:0 0 10px;font-size:14px;font-weight:700;letter-spacing:.14em;color:#4f7085}
.vision-title{margin:0;font-size:clamp(34px,6vw,64px);line-height:1.15;letter-spacing:.04em;color:#17324d}
.vision-subtitle{margin:14px 0 0;font-size:clamp(16px,2.4vw,22px);color:#547083}
.vision-main{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:32px 0 56px}
.vision-shell{background:#fff;border:1px solid #dfe8ee;border-radius:18px;padding:28px;box-shadow:0 8px 26px rgba(23,50,77,.05)}
.vision-shell h2{margin:0 0 8px;font-size:24px}
.vision-shell p{margin:0;color:#6a7f8f}
.vision-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.vision-block{min-height:150px;border:1px dashed #bfd0db;border-radius:14px;padding:20px;background:#fbfdff}
.vision-block h3{margin:0 0 8px;font-size:18px}
.vision-block p{margin:0;font-size:14px;color:#7a8d9a}
footer{text-align:center;padding:20px 16px;color:#789;font-size:13px}
@media(max-width:768px){
 .vision-hero{min-height:220px;padding:36px 20px}
 .vision-title{font-size:38px}
 .vision-subtitle{font-size:16px}
 .vision-main{width:calc(100% - 24px);padding:20px 0 36px}
 .vision-shell{padding:20px;border-radius:14px}
 .vision-grid{grid-template-columns:1fr;gap:12px}
 .vision-block{min-height:116px;padding:16px}
}
</style>
</head>
<body>
<header class="vision-hero">
  <div class="vision-hero-inner">
    <p class="vision-kicker">智慧藍田 LIVE 一點通</p>
    <h1 class="vision-title">藍田新願景</h1>
    <p class="vision-subtitle">正式內容將依後續規劃逐步建置</p>
  </div>
</header>
<main class="vision-main">
  <section class="vision-shell" aria-labelledby="visionContentTitle">
    <h2 id="visionContentTitle">藍田新願景</h2>
    <p>本頁目前為正式內容骨架，後續內容依實際規劃更新。</p>
    <div class="vision-grid">
      <section class="vision-block" aria-label="願景內容區">
        <h3>願景內容</h3>
        <p>待後續內容建置。</p>
      </section>
      <section class="vision-block" aria-label="政策內容區">
        <h3>政策內容</h3>
        <p>待後續內容建置。</p>
      </section>
      <section class="vision-block" aria-label="建設與進度區">
        <h3>建設與階段進度</h3>
        <p>待後續內容建置。</p>
      </section>
    </div>
  </section>
</main>
<footer>智慧藍田 LIVE 一點通</footer>
</body>
</html>
