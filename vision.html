<title>藍田新願景｜智慧藍田 LIVE 一點通</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef8ff}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17324d}
.vision-page{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(180deg,#eaf7ff 0%,#f7fcff 100%)}
.vision-stage{position:relative;width:min(1120px,100vw);aspect-ratio:1120/1024;margin:0 auto;overflow:hidden;background-image:url('vision-layout-v2.png');background-repeat:no-repeat;background-size:auto 100%;background-position:left top;line-height:0}
.hotspot{position:absolute;display:block;text-decoration:none;z-index:2;background:transparent;line-height:1;border-radius:50%}
.hotspot:focus-visible{outline:5px solid #fff;box-shadow:0 0 0 9px #1688e8;background:rgba(255,255,255,.08)}
.hotspot::after{content:"";position:absolute;inset:0;border-radius:inherit;transition:background .18s ease,box-shadow .18s ease}
@media (hover:hover){.hotspot:hover::after{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 3px rgba(255,255,255,.86)}}
/* Desktop crop: left panel of vision-layout-v2.png */
.smart{left:40.2%;top:3.0%;width:23.3%;height:27.5%}
.business{left:16.5%;top:17.6%;width:24.6%;height:27.0%}
.green{left:64.3%;top:17.6%;width:24.6%;height:27.0%}
.traffic{left:3.6%;top:43.9%;width:25.9%;height:22.5%}
.environment{left:22.3%;top:60.5%;width:22.0%;height:23.0%}
.infrastructure{left:40.2%;top:63.5%;width:21.4%;height:22.5%}
.care{left:61.2%;top:60.5%;width:20.1%;height:23.0%}
.culture{left:75.1%;top:43.9%;width:21.5%;height:22.5%}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:720px){
  .vision-page{background:#fff}
  .vision-stage{width:min(402px,100vw);aspect-ratio:402/1024;background-size:auto 100%;background-position:right top}
  /* Mobile crop: right panel of vision-layout-v2.png */
  .smart{left:22.4%;top:11.7%;width:44.0%;height:18.1%}
  .business{left:2.5%;top:22.9%;width:29.0%;height:14.2%}
  .green{left:66.0%;top:22.9%;width:30.0%;height:14.2%}
  .traffic{left:5.0%;top:48.8%;width:44.0%;height:14.6%}
  .environment{left:50.0%;top:48.8%;width:45.0%;height:14.6%}
  .infrastructure{left:5.0%;top:63.5%;width:44.0%;height:14.2%}
  .care{left:50.0%;top:63.5%;width:45.0%;height:14.2%}
  .culture{left:26.0%;top:79.0%;width:47.0%;height:14.0%}
}
</style>
</head>

  </section>
</main>

</html>
