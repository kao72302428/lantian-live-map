<!doctype html>

<title>藍田新願景｜智慧藍田 LIVE 一點通</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef8ff}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17324d}
.vision-page{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(180deg,#eaf7ff 0%,#f7fcff 100%)}
.vision-stage{position:relative;width:min(1536px,100vw);line-height:0;margin:0 auto;overflow:hidden}
.vision-stage picture,.vision-stage img{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;border-radius:28px;text-decoration:none;z-index:2;background:transparent;line-height:1}
.hotspot:focus-visible{outline:5px solid #fff;box-shadow:0 0 0 9px #1688e8;background:rgba(255,255,255,.08)}
.hotspot::after{content:"";position:absolute;inset:0;border-radius:inherit;transition:background .18s ease,box-shadow .18s ease}
@media (hover:hover){.hotspot:hover::after{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 3px rgba(255,255,255,.82)}}
.site-footer{text-align:center;padding:18px 12px 22px;color:#6f8391;font-size:14px;line-height:1.5;background:#f7fcff}
/* Desktop image: 1536 x 1024 */
.smart{left:40.2%;top:2.2%;width:19.7%;height:25.8%;border-radius:50%}
.business{left:21.1%;top:17.1%;width:20.1%;height:27.1%;border-radius:50%}
.green{left:60.8%;top:17.1%;width:20.2%;height:27.1%;border-radius:50%}
.traffic{left:13.5%;top:44.2%;width:17.4%;height:25.2%;border-radius:50%}
.environment{left:26.3%;top:60.7%;width:17.6%;height:25.8%;border-radius:50%}
.infrastructure{left:41.1%;top:64.0%;width:17.7%;height:26.1%;border-radius:50%}
.care{left:58.8%;top:60.6%;width:17.8%;height:25.9%;border-radius:50%}
.culture{left:69.1%;top:44.2%;width:17.5%;height:25.2%;border-radius:50%}
@media(max-width:720px){
  .vision-page{background:#fff}
  .vision-stage{width:100vw;max-width:941px}
  .site-footer{background:#fff;font-size:13px;padding:16px 10px 20px}
  /* Mobile image: 941 x 1672 */
  .smart{left:4.0%;top:43.1%;width:29.2%;height:16.2%;border-radius:26px}
  .business{left:35.1%;top:43.1%;width:29.5%;height:16.2%;border-radius:26px}
  .green{left:66.7%;top:43.1%;width:29.2%;height:16.2%;border-radius:26px}
  .traffic{left:5.1%;top:65.0%;width:43.2%;height:9.2%;border-radius:24px}

  .care{left:51.4%;top:74.7%;width:43.4%;height:9.5%;border-radius:24px}
  .culture{left:24.9%;top:85.1%;width:50.3%;height:9.0%;border-radius:24px}
}
