<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藍田新願景｜智慧藍田 LIVE 一點通</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef8ff}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17324d}
.vision-page{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(180deg,#eaf7ff 0%,#f7fcff 100%)}
.viewport{position:relative;width:min(1536px,100vw);aspect-ratio:1536/900;overflow:hidden;margin:0 auto}
.canvas{position:absolute;left:0;top:0;width:100%;aspect-ratio:1536/1024;background:url('vision-desktop.jpg') center top/100% auto no-repeat;line-height:0}
.hotspot{position:absolute;display:block;text-decoration:none;z-index:2;background:transparent;line-height:1;border-radius:50%}
.hotspot:focus-visible{outline:5px solid #fff;box-shadow:0 0 0 9px #1688e8;background:rgba(255,255,255,.08)}
.hotspot::after{content:"";position:absolute;inset:0;border-radius:inherit;transition:background .18s ease,box-shadow .18s ease}
@media(hover:hover){.hotspot:hover::after{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 3px rgba(255,255,255,.82)}}
.smart{left:40.2%;top:2.2%;width:19.7%;height:25.8%}
.business{left:21.1%;top:17.1%;width:20.1%;height:27.1%}
.green{left:60.8%;top:17.1%;width:20.2%;height:27.1%}
.traffic{left:13.5%;top:44.2%;width:17.4%;height:25.2%}
.environment{left:26.3%;top:60.7%;width:17.6%;height:25.8%}
.infrastructure{left:41.1%;top:64.0%;width:17.7%;height:26.1%}
.care{left:58.8%;top:60.6%;width:17.8%;height:25.9%}
.culture{left:69.1%;top:44.2%;width:17.5%;height:25.2%}
@media(max-width:720px){
  .vision-page{background:#fff}
  .viewport{width:100vw;aspect-ratio:941/1052}
  .canvas{width:100%;aspect-ratio:941/1672;background-image:url('vision-mobile.jpg');background-size:100% auto;background-position:center top;transform:translateY(-37.08%)}
  .smart{left:4.0%;top:43.1%;width:29.2%;height:16.2%;border-radius:26px}
  .business{left:35.1%;top:43.1%;width:29.5%;height:16.2%;border-radius:26px}
  .green{left:66.7%;top:43.1%;width:29.2%;height:16.2%;border-radius:26px}
  .traffic{left:5.1%;top:65.0%;width:43.2%;height:9.2%;border-radius:24px}
  .environment{left:51.4%;top:65.0%;width:43.4%;height:9.2%;border-radius:24px}
  .infrastructure{left:5.1%;top:74.7%;width:43.2%;height:9.5%;border-radius:24px}
  .care{left:51.4%;top:74.7%;width:43.4%;height:9.5%;border-radius:24px}
  .culture{left:24.9%;top:85.1%;width:50.3%;height:9.0%;border-radius:24px}
}
</style>
</head>
<body>
<main class="vision-page">
  <section class="viewport" aria-label="藍田新願景八大主題導覽">
    <div class="canvas">
      <a class="hotspot smart" href="vision-smart.html" aria-label="智慧社區｜核心主軸"></a>
      <a class="hotspot business" href="vision-business.html" aria-label="推動商圈發展｜核心主軸"></a>
      <a class="hotspot green" href="vision-green.html" aria-label="淨零綠生活｜核心主軸"></a>
      <a class="hotspot traffic" href="vision-traffic.html" aria-label="交通安全｜里政治理目標"></a>
      <a class="hotspot environment" href="vision-environment.html" aria-label="環境清消｜里政治理目標"></a>
      <a class="hotspot infrastructure" href="vision-infrastructure.html" aria-label="燈亮・路平・水溝通｜里政治理目標"></a>
      <a class="hotspot care" href="vision-care.html" aria-label="長者・幼童・弱勢照護｜里政治理目標"></a>
      <a class="hotspot culture" href="vision-culture.html" aria-label="人文教育｜里政治理目標"></a>
    </div>
  </section>
</main>
</body>
</html>
