<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藍田新願景｜智慧藍田 LIVE 一點通</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef8ff}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17324d}
.vision-page{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(180deg,#eaf7ff 0%,#f7fcff 100%)}
.desktop-viewport{position:relative;width:min(1536px,100vw);aspect-ratio:1536/900;overflow:hidden;margin:0 auto}
.desktop-canvas{position:absolute;left:0;top:0;width:100%;aspect-ratio:1536/1024;background:url('vision-desktop.jpg') center top/100% auto no-repeat;line-height:0}
.hotspot{position:absolute;display:block;text-decoration:none;z-index:2;background:transparent;line-height:1;border-radius:50%}
.hotspot:focus-visible{outline:5px solid #fff;box-shadow:0 0 0 9px #1688e8;background:rgba(255,255,255,.08)}
.hotspot::after{content:"";position:absolute;inset:0;border-radius:inherit;transition:background .18s ease,box-shadow .18s ease}
@media(hover:hover){.hotspot:hover::after{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 3px rgba(255,255,255,.82)}}
.smart{left:40.2%;top:2.2%;width:19.7%;height:25.8%}
.business{left:21.1%;top:17.1%;width:20.1%;height:27.1%}
.green{left:60.8%;top:17.1%;width:20.2%;height:27.1%}
.traffic{left:13.5%;top:44.2%;width:17.4%;height:25.2%}
.environment{left:26.3%;top:60.7%;width:17.6%;height:25.8%}
.infrastructure{left:41.1%;top:64.0%;width:17.7%;height:26.1%}
.care{left:58.8%;top:60.6%;width:17.8%;height:25.9%}
.culture{left:69.1%;top:44.2%;width:17.5%;height:25.2%}
.mobile-layout{display:none}

@media(max-width:720px){
  html,body{background:#eefbf3}
  .vision-page{display:block;min-height:100dvh;background:#eefbf3}
  .desktop-viewport{display:none}
  .mobile-layout{position:relative;display:block;width:100%;max-width:720px;min-height:100dvh;margin:0 auto;padding:10px 10px 18px;overflow:hidden;background:linear-gradient(rgba(250,255,252,.72),rgba(248,255,250,.74)),url('vision-mobile.jpg') center bottom/100% auto no-repeat}
  .mobile-layout::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(245,252,255,.86) 0%,rgba(247,255,249,.72) 44%,rgba(239,252,240,.58) 100%);pointer-events:none}
  .mobile-inner{position:relative;z-index:1}
  .mobile-heading{margin:0 auto 8px;text-align:center;font-size:clamp(24px,7.2vw,38px);font-weight:900;color:#0b5160;line-height:1.15;letter-spacing:.02em;text-shadow:0 1px 0 #fff}
  .mobile-heading.gov{margin-top:8px;color:#0c5f39}

  .core-triangle{position:relative;width:100%;height:min(86vw,610px);margin:0 auto 8px}
  .card-link{position:absolute;display:block;text-decoration:none;filter:drop-shadow(0 5px 12px rgba(26,89,78,.16))}
  .card-link:focus-visible{outline:4px solid #1688e8;outline-offset:3px;border-radius:22px}
  .card-link svg{display:block;width:100%;height:auto;overflow:visible}
  .smart-m{width:44%;left:28%;top:0}
  .business-m{width:46%;left:2%;bottom:0}
  .green-m{width:46%;right:2%;bottom:0}
  .core-arrow{position:absolute;display:grid;place-items:center;z-index:3;width:11vw;height:11vw;max-width:56px;max-height:56px;border-radius:50%;background:rgba(255,255,255,.96);color:#1688e8;font-size:clamp(28px,8vw,44px);font-weight:900;box-shadow:0 4px 12px rgba(0,91,170,.16);line-height:1}
  .core-arrow.a1{left:18%;top:39%;transform:rotate(6deg)}
  .core-arrow.a2{left:45%;bottom:3%;transform:rotate(-2deg)}
  .core-arrow.a3{right:18%;top:39%;transform:rotate(-8deg)}

  .gov-plum{position:relative;width:100%;height:min(92vw,650px);margin:0 auto}
  .traffic-m{width:56%;left:22%;top:0}
  .environment-m{width:47%;right:1%;top:31%}
  .infrastructure-m{width:47%;left:1%;top:31%}
  .care-m{width:47%;right:1%;bottom:0}
  .culture-m{width:56%;left:3%;bottom:0}
}
</style>
</head>
<body>
<main class="vision-page">
  <section class="desktop-viewport" aria-label="藍田新願景八大主題導覽">
    <div class="desktop-canvas">
      <a class="hotspot smart" href="vision-smart.html" aria-label="智慧社區｜核心主軸"></a>
      <a class="hotspot business" href="vision-business.html" aria-label="推動商圈發展｜核心主軸"></a>
      <a class="hotspot green" href="vision-green.html" aria-label="淨零綠生活｜核心主軸"></a>
      <a class="hotspot traffic" href="vision-traffic.html" aria-label="交通安全｜里政治理目標"></a>
      <a class="hotspot environment" href="vision-environment.html" aria-label="環境清消｜里政治理目標"></a>
      <a class="hotspot infrastructure" href="vision-infrastructure.html" aria-label="燈亮・路平・水溝通｜里政治理目標"></a>
      <a class="hotspot care" href="vision-care.html" aria-label="長者・幼童・弱勢照護｜里政治理目標"></a>
      <a class="hotspot culture" href="vision-culture.html" aria-label="人文教育｜里政治理目標"></a>
    </div>
  </section>

  <section class="mobile-layout" aria-label="藍田新願景手機版八大主題導覽">
    <div class="mobile-inner">
      <h1 class="mobile-heading">三大核心主軸</h1>
      <div class="core-triangle">
        <a class="card-link smart-m" href="vision-smart.html" aria-label="智慧社區｜核心主軸">
          <svg viewBox="15 735 290 280" role="img" aria-label="智慧社區"><image href="vision-mobile.jpg" x="0" y="0" width="941" height="1672"/></svg>
        </a>
        <span class="core-arrow a1" aria-hidden="true">↙</span>
        <a class="card-link business-m" href="vision-business.html" aria-label="推動商圈發展｜核心主軸">
          <svg viewBox="315 735 295 280" role="img" aria-label="推動商圈發展"><image href="vision-mobile.jpg" x="0" y="0" width="941" height="1672"/></svg>
        </a>
        <span class="core-arrow a2" aria-hidden="true">→</span>
        <a class="card-link green-m" href="vision-green.html" aria-label="淨零綠生活｜核心主軸">
          <svg viewBox="625 735 300 280" role="img" aria-label="淨零綠生活"><image href="vision-mobile.jpg" x="0" y="0" width="941" height="1672"/></svg>
        </a>
        <span class="core-arrow a3" aria-hidden="true">↖</span>
      </div>

      <h2 class="mobile-heading gov">五大里政治理目標</h2>
      <div class="gov-plum">
        <a class="card-link traffic-m" href="vision-traffic.html" aria-label="交通安全｜里政治理目標">
          <svg viewBox="30 1110 410 160" role="img" aria-label="交通安全"><image href="vision-mobile.jpg" x="0" y="0" width="941" height="1672"/></svg>
        </a>
        <a class="card-link infrastructure-m" href="vision-infrastructure.html" aria-label="燈亮・路平・水溝通｜里政治理目標">
          <svg viewBox="25 1280 420 170" role="img" aria-label="燈亮・路平・水溝通"><image href="vision-mobile.jpg" x="0" y="0" width="941" height="1672"/></svg>
        </a>
        <a class="card-link environment-m" href="vision-environment.html" aria-label="環境清消｜里政治理目標">
          <svg viewBox="492 1110 410 160" role="img" aria-label="環境清消"><image href="vision-mobile.jpg" x="0" y="0" width="941" height="1672"/></svg>
        </a>
        <a class="card-link culture-m" href="vision-culture.html" aria-label="人文教育｜里政治理目標">
          <svg viewBox="220 1460 500 170" role="img" aria-label="人文教育"><image href="vision-mobile.jpg" x="0" y="0" width="941" height="1672"/></svg>
        </a>
        <a class="card-link care-m" href="vision-care.html" aria-label="長者・幼童・弱勢照護｜里政治理目標">
          <svg viewBox="490 1280 420 170" role="img" aria-label="長者・幼童・弱勢照護"><image href="vision-mobile.jpg" x="0" y="0" width="941" height="1672"/></svg>
        </a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
