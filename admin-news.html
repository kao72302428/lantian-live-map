<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地方大小事管理｜智慧藍田管理中心</title>
<link rel="stylesheet" href="./admin-news.css?v=20260930-2">
</head>
<body>
<header class="topbar">
  <a class="back" href="./admin.html">← 返回管理中心</a>
  <div>
    <div class="title">地方大小事管理</div>
    <div class="sub">智慧藍田 LIVE 一點通</div>
  </div>
  <span class="badge">管理員專用</span>
</header>

<main class="shell">
  <section class="lockbox">
    <div>
      <p class="eyebrow">AUTH STATUS</p>
      <h1 id="authTitle">正在驗證管理員</h1>
      <p id="authText">本頁會再次驗證 LINE 管理員身分，驗證成功後才開放新增、修改、下架與刪除。</p>
    </div>
    <div id="authStatus" class="status">驗證中…</div>
  </section>

  <section class="panel">
    <div class="section-head">
      <div>
        <p class="eyebrow">EDITOR</p>
        <h2 id="formTitle">新增消息</h2>
      </div>
      <button id="newBtn" type="button" class="secondary" disabled>新增一則</button>
    </div>

    <form id="newsForm" class="form-grid">
      <input id="id" type="hidden">
      <label>日期<input id="date" type="date" required disabled></label>
      <label class="wide">標題<input id="title" type="text" placeholder="例如：高大特區道路施工通知" required disabled></label>
      <label class="wide">摘要<textarea id="summary" rows="2" placeholder="顯示在消息卡上的短摘要" required disabled></textarea></label>
      <label class="wide">完整內容<textarea id="content" rows="5" placeholder="點開消息卡後顯示的完整內容" required disabled></textarea></label>
      <label class="wide">圖片網址<input id="image" type="url" placeholder="選填" disabled></label>
      <label class="wide">地圖網址<input id="map" type="url" placeholder="選填" disabled></label>
      <label class="wide">外部連結<input id="link" type="url" placeholder="選填" disabled></label>
      <label>連結文字<input id="linkText" type="text" placeholder="例如：查看詳細資訊" disabled></label>
      <label class="publish-toggle"><input id="published" type="checkbox" checked disabled> 前台公開</label>
      <div class="actions wide">
        <button id="saveDraftBtn" type="button" class="secondary" disabled>儲存為未公開</button>
        <button id="publishBtn" type="submit" class="primary" disabled>儲存並發布</button>
      </div>
    </form>
    <div id="formMessage" class="form-message" hidden></div>
  </section>

  <section class="panel">
    <div class="section-head">
      <div>
        <p class="eyebrow">CURRENT NEWS</p>
        <h2>目前消息</h2>
      </div>
      <span id="count" class="count">載入中</span>
    </div>
    <div id="list" class="news-list"><div class="empty">正在讀取消息資料…</div></div>
  </section>
</main>

<footer>智慧藍田 LIVE 一點通｜地方大小事管理</footer>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./admin-news.js?v=20260930-2"></script>
</body>
</html>
