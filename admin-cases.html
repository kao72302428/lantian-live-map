<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>建言與合作案件管理｜智慧藍田管理中心</title>
<link rel="stylesheet" href="./admin-module.css?v=20260930-1"><link rel="stylesheet" href="./admin-cases.css?v=20261007-phase2">
</head><body>
<header class="topbar"><a class="back" href="./admin.html">← 返回管理中心</a><div><div class="title">建言與合作案件管理</div><div class="sub">智慧藍田 LIVE 一點通</div></div><span class="badge">管理員專用</span></header>
<main class="shell">
<section class="gate"><p class="eyebrow">AUTH STATUS</p><h1 id="authTitle">管理員驗證中</h1><p class="lead">管理中心驗證成功後，可直接載入案件、更新處理狀態及回覆案件。</p><div id="authStatus" class="status">驗證中…</div></section>
<section class="panel" id="casePanel">
 <div class="case-head"><div><p class="eyebrow">CASE MANAGEMENT</p><h2>案件管理</h2></div><button id="loadBtn" class="primary" type="button" disabled>載入案件</button></div>
 <div class="filters">
  <label>搜尋<input id="searchInput" type="search" placeholder="案件編號、姓名、電話、Email、內容關鍵字"></label>
  <label>處理狀態<select id="statusFilter"><option value="">全部</option><option>未處理</option><option>處理中</option><option>已完成</option></select></label>
 </div>
 <div id="caseMessage" class="case-message">等待管理員驗證後載入案件。</div>
 <div id="caseCount" class="case-count"></div>
 <div id="caseList" class="case-list"></div>
</section>
</main>
<footer>智慧藍田 LIVE 一點通｜建言與合作案件管理</footer>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</body></html>
